AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AskMyBank.ai — Serverless RAG API
  Lambda + API Gateway HTTP API + EventBridge warming
  Vector search via S3 + NumPy (no ChromaDB dependency in Lambda)

Parameters:
  VectorsBucket:
    Type: String
    Description: S3 bucket containing vectors.npy and metadata.json
    Default: askmybank-vectors

  S3SourceBucket:
    Type: String
    Description: S3 bucket where raw banking PDFs land (source for Textract)
    Default: banking-docs-poc-qahftr

  PipelineBatchSize:
    Type: Number
    Description: Number of documents the scheduled drainer processes per run
    Default: 20

  BedrockRegion:
    Type: String
    Default: us-east-1

  ClickHouseHost:
    Type: String
    Default: ""

  ClickHouseUser:
    Type: String
    Default: ""

  DemoApiKey:
    Type: String
    Default: ""
    Description: Optional API key for demo access (X-Demo-Key header). Leave blank to disable.

  OrkesApiUrl:
    Type: String
    Default: ""
    Description: Orkes Conductor API base URL (e.g. https://developer.orkescloud.com/api)

  OrkesKeyId:
    Type: String
    Default: ""
    Description: Orkes application key ID

  OrkesKeySecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Orkes application key secret

  AppianBaseUrl:
    Type: String
    Default: ""
    Description: Appian REST API base URL (e.g. https://yoursite.appiancloud.com/suite/webapi)

  AppianApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Appian API key for creating HITL cases

  ClickHousePassword:
    Type: String
    Default: ""
    NoEcho: true
    Description: ClickHouse Cloud password for NL→SQL aggregation queries.

  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

Globals:
  Function:
    Runtime: python3.11
    # 870s (14.5 min) — Textract async jobs can take up to 2 min;
    # pipeline step endpoints poll, so Lambda must outlast the poll window.
    # RAG/chat routes finish in <5s — this only affects billing when steps are running.
    Timeout: 870
    MemorySize: 512      # enough for numpy + 4MB vectors in memory
    Environment:
      Variables:
        S3_VECTORS_BUCKET:    !Ref VectorsBucket
        S3_SOURCE_BUCKET:     !Ref S3SourceBucket
        BEDROCK_REGION:       !Ref BedrockRegion
        CLICKHOUSE_HOST:      !Ref ClickHouseHost
        CLICKHOUSE_USER:      !Ref ClickHouseUser
        CLICKHOUSE_PASSWORD:  !Ref ClickHousePassword
        DEMO_API_KEY:         !Ref DemoApiKey
        ORKES_API_URL:        !Ref OrkesApiUrl
        ORKES_KEY_ID:         !Ref OrkesKeyId
        ORKES_KEY_SECRET:     !Ref OrkesKeySecret
        APPIAN_BASE_URL:      !Ref AppianBaseUrl
        APPIAN_API_KEY:       !Ref AppianApiKey
        HITL_SQS_QUEUE_URL:   !Ref HITLQueue
        PIPELINE_QUEUE_URL:   !Ref PipelineQueue
        PIPELINE_BATCH_SIZE:  !Ref PipelineBatchSize

Resources:

  # ── Lambda Function ─────────────────────────────────────────────────────────
  AskMyBankFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile   # uses Makefile target build-AskMyBankFunction
    Properties:
      FunctionName: !Sub "askmybank-api-${Stage}"
      CodeUri: .
      Handler: lambda_handler.handler
      Description: AskMyBank RAG API — S3 vectors + Bedrock + ClickHouse
      Policies:
        # Read vectors from S3
        - S3ReadPolicy:
            BucketName: !Ref VectorsBucket
        # Call Bedrock models
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
        # Textract — for document pipeline
        - Statement:
            - Effect: Allow
              Action:
                - textract:StartDocumentTextDetection
                - textract:GetDocumentTextDetection
              Resource: "*"
        # S3 — read source PDFs for Textract pipeline
        - S3ReadPolicy:
            BucketName: !Ref S3SourceBucket
        # S3 — write updated vectors.npy + metadata.json
        - S3CrudPolicy:
            BucketName: !Ref VectorsBucket
        # SQS — HITL banker queue (send to Appian)
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt HITLQueue.Arn
        # SQS — Pipeline intake queue (receive, delete, send, inspect depth)
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:ChangeMessageVisibility
              Resource:
                - !GetAtt PipelineQueue.Arn
                - !GetAtt PipelineDLQ.Arn
      Events:
        # API Gateway HTTP API (cheaper than REST API)
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskMyBankApi
            Path: /
            Method: GET
        ApiAsk:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskMyBankApi
            Path: /ask
            Method: POST
        ApiHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskMyBankApi
            Path: /health
            Method: GET
        ApiOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskMyBankApi
            Path: /{proxy+}
            Method: ANY

  # ── API Gateway HTTP API ────────────────────────────────────────────────────
  AskMyBankApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default    # $default stage → no stage prefix in URL → FastAPI routes match correctly
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10    # max simultaneous requests
        ThrottlingRateLimit: 5      # requests per second sustained
      CorsConfiguration:
        AllowOrigins:
          - "https://askmybank.ai"
          - "https://www.askmybank.ai"
          - "https://dpanwar-vigyan.github.io"   # back-office review UI
          - "http://localhost:3000"               # local dev
          - "http://localhost:8080"               # local dev alt
        AllowMethods:
          - GET
          - POST
          - PUT
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Backoffice-Key                      # back-office auth header

  # ── EventBridge Warming Rule — pings Lambda every 5 minutes ────────────────
  WarmingRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "askmybank-warming-${Stage}"
      Description: Keep AskMyBank Lambda warm — ping every 5 minutes
      ScheduleExpression: "rate(5 minutes)"
      State: ENABLED
      Targets:
        - Id: WarmAskMyBank
          Arn: !GetAtt AskMyBankFunction.Arn
          Input: '{"source": "warming", "query": ""}'

  WarmingPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AskMyBankFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WarmingRule.Arn

  # Note: S3 bucket 'askmybank-vectors' was created manually — not managed by SAM

  # ── SQS: HITL Case Queue ────────────────────────────────────────────────────
  # Dead-letter queue — messages that fail 3 delivery attempts land here
  HITLDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "askmybank-hitl-dlq-${Stage}"
      MessageRetentionPeriod: 1209600    # 14 days
      Tags:
        - Key: Project
          Value: askmybank

  # Main HITL queue — Appian polls this for new cases
  HITLQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "askmybank-hitl-${Stage}"
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt HITLDeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: askmybank

  # ── SQS: Document Pipeline Intake Queue ─────────────────────────────────────
  # All incoming document events land here (S3 events, API calls, Appian triggers).
  # The scheduled drainer pops batches and starts Orkes workflows at a controlled rate.
  # Queue depth = live backlog visibility (month-end burst sits here harmlessly).

  PipelineDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "askmybank-pipeline-dlq-${Stage}"
      MessageRetentionPeriod: 1209600    # 14 days — inspect failed doc events
      Tags:
        - Key: Project
          Value: askmybank

  PipelineQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "askmybank-pipeline-${Stage}"
      # 10 min — enough for the drainer Lambda to start Orkes workflow before re-queuing
      VisibilityTimeout: 600
      # 7 days — month-end burst can wait without message loss
      MessageRetentionPeriod: 604800
      ReceiveMessageWaitTimeSeconds: 5
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PipelineDLQ.Arn
        # After 3 failed drain attempts → DLQ for manual ops review
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: askmybank

  # ── SQS Queue Policy: allow S3 to send events to PipelineQueue ──────────────
  # S3 event notifications require an explicit resource-based policy on the queue.
  # Without this, the S3 console shows "Unable to validate destination configurations".
  PipelineQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref PipelineQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt PipelineQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:s3:::${S3SourceBucket}"

  # ── EventBridge: Pipeline Drain Schedule ─────────────────────────────────────
  # Fires every 30 minutes → Lambda pops PIPELINE_BATCH_SIZE docs from PipelineQueue
  # → starts that many Orkes workflows → returns.
  # Tune the schedule or batch size to control throughput without touching code.
  # Low priority pipeline: overnight month-end burst clears at its own pace.

  PipelineDrainRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "askmybank-pipeline-drain-${Stage}"
      Description: Pop a batch from PipelineQueue and start Orkes workflows
      ScheduleExpression: "rate(5 minutes)"
      State: ENABLED
      Targets:
        - Id: DrainPipelineQueue
          Arn: !GetAtt AskMyBankFunction.Arn
          Input: '{"source": "pipeline_drain"}'

  PipelineDrainPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AskMyBankFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PipelineDrainRule.Arn

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${AskMyBankApi}.execute-api.${AWS::Region}.amazonaws.com"

  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt AskMyBankFunction.Arn

  VectorsBucketName:
    Description: S3 bucket containing vectors
    Value: !Ref VectorsBucket

  HITLQueueUrl:
    Description: SQS queue URL — configure in Appian Connected System
    Value: !Ref HITLQueue

  HITLQueueArn:
    Description: SQS queue ARN
    Value: !GetAtt HITLQueue.Arn

  HITLDeadLetterQueueUrl:
    Description: DLQ — messages Appian failed to process 3 times
    Value: !Ref HITLDeadLetterQueue

  PipelineQueueUrl:
    Description: Pipeline intake queue — configure S3 event notification to point here
    Value: !Ref PipelineQueue

  PipelineQueueArn:
    Description: Pipeline intake queue ARN — for S3 event notification config
    Value: !GetAtt PipelineQueue.Arn

  PipelineDLQUrl:
    Description: Pipeline DLQ — docs that failed to drain 3 times land here
    Value: !Ref PipelineDLQ
